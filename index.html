<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>id.exe</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div id="cur"></div>

    <div class="wrap">
        <header class="top">
        <span>id.exe</span>
        <div class="themes">
            <button onclick="setTheme('cream')">cream</button>
            <button onclick="setTheme('dark')">dark</button>
            <button onclick="setTheme('olive')">olive</button>
        </div>
        </header>
        <main class="grid">
            <section id="formbox">
                <div class="field">
                    <label>name</label>
                    <input oninput="update()" id="inName">
                </div>
                <div class="field">
                    <label>handle</label>
                    <input id="inHandle" oninput="update()">
                </div>
                <div class="field">
                    <label>intrests (seprated)</label>
                    <input id="inStack" oninput="update()"
                </div>
                <div class="field">
                    <label>aiming for</label>
                    <input id="inGoal" oninput="update()">
                </div>
                <div class="field">
                    <label>links</label>
                    <input id="inLink" oninput="update()">
                </div>
            </section>
            <section id="cardbox"></section>
        </main>
    </div>
    <script src="script.js">
    </script>
    
</body>
</html>
