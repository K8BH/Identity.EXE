<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embassy Pixelator</title>
    <link rel="stylesheet" href="pfp.css">
</head>
<body>
    <div id="cur"></div>

    <nav class="navbar">
        <div class="nav-brand">K8BH Dev.</div>
        <div class="nav-links">
            <a href="index.html">ID card Producer</a>
            <a href="pfp.html" class="active">PFP_Producer</a>
        </div>
    </nav>

    <div class="wrap">
        <header class="top">
            <h1 class="logo">pfp.exe</h1>
            <p class="sub">upload. pixelate. stamp.</p>
        </header>

        <main class="pfp-workspace">
            <section class="controls">
                <div class="field">
                    <label>select image</label>
                    <input type="file" id="imgUpload" accept="image/*">
                </div>
                <div class="field">
                    <label>Pixel Size</label>
                    <input type="range" id="pxSlider" min="2" max="24" value="8">
                </div>
                <div class="actions">
                    <button onclick="downloadPfp()">Download ur pfp gng</button>
                </div>
            </section>
            <section class="preview">
               
                <canvas id="pfpCanvas" width="320" height="320"></canvas>
            </section>
        </main>
    </div>
     <div class="sticker" style="top: -10px; transform: rotate(-5deg);">Nice PFP gng</div>
                <img src="Dude_Monster.png" class="img-sticker" style="width: 64px; " alt="Dude">
                <img src="Owlet_Monster.png" class="img-sticker" style=" width: 56px;" alt="Owlet">
    <script src="pfp.js"></script>
</body>
</html>
